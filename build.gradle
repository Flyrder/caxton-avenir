plugins {
    id 'org.relativitymc.neo-loom-remap' version '1.15.13' apply false
    id 'maven-publish'
    id "com.diffplug.spotless" version "8.2.1"
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

repositories {
    mavenCentral()
    maven {
        url = "https://repo.codemc.io/repository/relativitymc/"
    }
}

subprojects {
    if (project.name != "caxton-impl") {
        apply plugin: "org.relativitymc.neo-loom-remap"

        repositories {
            maven {
                url = "https://repo.codemc.io/repository/relativitymc/"
            }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${minecraft_version}"
            mappings loom.layered() {
                it.mappings("org.relativitymc:modern-yarn:${project.yarn_mappings}:v2")
                it.mappings("org.relativitymc:modern-yarn-mappings-patch-neoforge:${project.yarn_mappings_patch}")
                it.mappings file("../mappings/yarnpatch.tiny")
            }
        }

        loom {
            useIntermediateMappings = true
            intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
        }

        javadoc {
            options {
                tags(
                        'apiNote:a:API Note:',
                        'implSpec:a:Implementation Requirements:',
                        'implNote:a:Implementation Note:'
                )
            }
        }
    }
}

base {
    archivesName = project.archives_base_name
}

spotless {
    format 'misc', {
        // define the files to apply `misc` to
        target '*.gradle', '.gitattributes', '.gitignore'

        // define the steps to apply to those files
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
    java {
        target '*/src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        formatAnnotations()
        licenseHeader '// (C) $YEAR +merlan #flirora.\n// SPDX-License-Identifier: MIT'
    }
    json {
        target '*/src/**/*.json'
        simple()
    }
}

publishMods {
    changelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE

    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        projectId = "1320863"
        minecraftVersions.add("" + rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        clientRequired = true
        serverRequired = false
        projectSlug = "caxton"
        incompatible("emojiful")
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "k8iIgzXE"
        minecraftVersions.add("" + rootProject.minecraft_version)
//        projectDescription = providers.fileContents(layout.projectDirectory.file("README.md")).asText
        incompatible {
            slug = "emojiful"
        }
    }

    // Fabric specific options for CurseForge
    curseforge("curseforgeFabric") {
        from cfOptions
        file project(":fabric")
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
        version = "${rootProject.version}+${rootProject.minecraft_version}-FABRIC"
        displayName = "Caxton " + "${rootProject.version}+${rootProject.minecraft_version}-FABRIC"
    }

    // NeoForge specific options for CurseForge
    curseforge("curseforgeNeoforge") {
        from cfOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        version = "${rootProject.version}+${rootProject.minecraft_version}-NEOFORGE"
        displayName = "Caxton " + "${rootProject.version}+${rootProject.minecraft_version}-NEOFORGE"
    }

    // Fabric specific options for Modrinth
    modrinth("modrinthFabric") {
        from mrOptions
        file project(":fabric")
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
        version = "${rootProject.version}+${rootProject.minecraft_version}-FABRIC"
        displayName = "Caxton " + "${rootProject.version}+${rootProject.minecraft_version}-FABRIC"
    }

    // NeoForge specific options for Modrinth
    modrinth("modrinthNeoforge") {
        from mrOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        version = "${rootProject.version}+${rootProject.minecraft_version}-NEOFORGE"
        displayName = "Caxton " + "${rootProject.version}+${rootProject.minecraft_version}-NEOFORGE"
    }
}
