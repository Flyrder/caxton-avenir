plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.4-SNAPSHOT" apply false
    id 'maven-publish'
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    if (project.name != "caxton-impl") {
        apply plugin: "dev.architectury.loom"

        dependencies {
            minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
            // Forge adds an Explosion#getPosition() method, which conflicts
            // with method_55109, which is named getPosition in Yarn and
            // something else in Mojmap.
            // NeoForge has fixed this issue: https://github.com/neoforged/NeoForge/pull/339
            // TODO: remove this workaround if/when we drop Forge support or Forge fixes this issue
            // Thanks to embeddedt for the solution.
            mappings loom.layered() {
                it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
                it.mappings file("../mappings/yarnpatch.tiny")
            }
        }
    }
}

allprojects {
    if (project.name != "caxton-impl") {
        apply plugin: "java"
        apply plugin: "architectury-plugin"
        apply plugin: "maven-publish"

        base {
            archivesName = rootProject.archives_base_name
        }
        version = "${rootProject.mod_version}+${rootProject.minecraft_version}-${project.name.toUpperCase()}"
        group = rootProject.maven_group

        repositories {
            // Add repositories to retrieve artifacts from in here.
            // You should only use this when depending on other mods because
            // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
            // See https://docs.gradle.org/current/userguide/declaring_repositories.html
            // for more information about repositories.
            mavenCentral()
            maven { url "https://jitpack.io" }
            maven { url "https://maven.terraformersmc.com" }
            maven { url "https://api.modrinth.com/maven" }
            maven { url "https://maven.neoforged.net/releases/" }
        }

        tasks.withType(JavaCompile) {
            options.encoding = "UTF-8"
            options.release = 17
        }

        java {
            withSourcesJar()
        }
    }
}

base {
    archivesName = project.archives_base_name
}

configurations.all {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:$fabric_loader_version")
    }
}
