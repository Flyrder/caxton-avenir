variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

build-image:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG docker/
    - docker push $IMAGE_TAG
  rules:
    - changes:
        - docker/Dockerfile
    - if: $CI_JOB_MANUAL == "true"

build:
  image: $IMAGE_TAG
  stage: build
  script: gradle --build-cache build -Dxyz.flirora.caxton.additionalTargets=x86_64-pc-windows-gnu
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull-push
    paths:
      - "**/build"
      - .gradle
      - caxton-impl/target
  needs:
    - job: build-image
      optional: true
  artifacts:
    paths:
      - forge/build/libs/
      - fabric/build/libs/

#test:
