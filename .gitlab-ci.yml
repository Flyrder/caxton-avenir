#      - .gradle

deploy-maven-snapshot:
  image: $IMAGE_TAG
  stage: deploy
  script: gradle publish -Dxyz.flirora.caxton.additionalTargets=x86_64-pc-windows-gnu
  environment: production
  dependencies:
    - build
  needs:
    - job: build
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - "**/build"
      - .gradle
      - caxton-impl/target
