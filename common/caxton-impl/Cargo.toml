[package]
name = "caxton-impl"
description = "Native library for the Caxton mod for Minecraft"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://gitlab.com/Kyarei/caxton"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.68"
base64 = "0.21.0"
fdsm = { version = "0.1.1", features = ["ttf-parser"] }
image = { version = "0.24.6", default-features = false }
jni = "0.21.1"
rustybuzz = "0.8.0"
nanoserde = "0.1.33"
sha2 = "0.10.6"
ttf-parser = "0.19.1"
flate2 = "1.0.25"
rayon = "1.6.1"
ab_glyph_rasterizer = "0.1.8"
nalgebra = "0.32.3"

[lib]
crate_type = ["cdylib"]

[profile.release]
panic = 'abort'
