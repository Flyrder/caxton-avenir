[package]
name = "caxton-impl"
description = "Native library for the Caxton mod for Minecraft"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://gitlab.com/Kyarei/caxton"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
fdsm = "0.7.0"
fdsm-ttf-parser = "0.1.2"
image = { version = "0.25.6", default-features = false }
jni = "0.21.1"
rustybuzz = "0.20.1"
nanoserde = "0.2.1"
sha2 = "0.10.9"
ttf-parser = "0.25.1"
flate2 = "1.1.2"
rayon = "1.10.0"
ab_glyph_rasterizer = "0.1.8"
nalgebra = "0.33.2"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = 'abort'
