import java.util.regex.Pattern

architectury {
    injectInjectables = false
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/examplemod.accesswidener")
}

configurations {
    backend {
        canBeConsumed false
        canBeResolved true
    }
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    // modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // Used for more precise mixins (e.g. for registering new shaders).
    annotationProcessor(implementation("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))

//    modLocalRuntime "com.terraformersmc:modmenu:6.1.0-beta.3"
    // Known to break Caxton in the past (#37).
    // modLocalRuntime "dev.emi:emi:0.7.0+1.19.3"

    // Used for caching layout results
    implementation('com.github.ben-manes.caffeine:caffeine:3.1.2')

    // ImmediatelyFast API for compatibility – use only in ImmediatelyFastBatchingAccess class!
    modCompileOnly("maven.modrinth:immediatelyfast:1.10.0+1.21.6-fabric")

    backend(project('caxton-impl'))
}

def identifyHostRustcPlatform = tasks.register("identifyHostRustcPlatform", Exec) {
    commandLine 'rustc', '-vV'

    standardOutput = new ByteArrayOutputStream()

    ext.output = {
        def output = standardOutput.toString()
        def matcher = Pattern.compile("^host: (.*)\$", Pattern.MULTILINE).matcher(output)
        matcher.find()
        def platform = matcher.group(1)
        println("Platform is $platform")
        platform
    }
}

processResources {
    dependsOn identifyHostRustcPlatform

    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    from(configurations.backend) {
        eachFile {
            if (!name.contains("-") && !name.contains("checksum")) {
                // Exclude the artifact from the default Cargo task
                exclude()
            }
            path = "natives/" + path
        }
    }
}

loom {
    runs {
        client {
            environmentVariable("RUST_BACKTRACE", "1")
        }
    }
    accessWidenerPath = file("src/main/resources/caxton.accesswidener")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    repositories {
        maven {
            name = "gitlab-package-registry"
            url = "https://gitlab.com/api/v4/projects/" + System.getenv("CI_PROJECT_ID") + "/packages/maven"
            credentials(HttpHeaderCredentials) {
                name = 'Job-Token'
                value = System.getenv("CI_JOB_TOKEN")
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

javadoc {
    options.overview = 'src/main/java/overview.html'
}