plugins {
    id 'multiloader-loader'
    id 'org.relativitymc.neo-loom-remap'
}

repositories {
    maven {
        url = "https://maven.architectury.dev/"
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "io.github.juuxel:unprotect-fancymodloader10:2.0.2"
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    include(implementation('com.github.ben-manes.caffeine:caffeine:3.1.2'))

//    modRuntimeOnly("maven.modrinth:immediatelyfast:${rootProject.immediatelyfast_version}-neoforge")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('NeoForge Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
    }
}

remapJar {
    atAccessWideners.add("caxton.accesswidener")
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
