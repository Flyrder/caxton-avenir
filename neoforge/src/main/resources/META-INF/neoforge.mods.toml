license = "MIT"

[[mods]]
modId = "caxton"
version = "0.5.6+1.20.5-NEOFORGE"
displayName = "Caxton"
authors = "+merlan #flirora"
description = '''
Adds TTF and OTF font support to Minecraft.
'''
logoFile = "assets/caxton/icon.png"

[[dependencies.caxton]]
modId = "neoforge"
type = "required"
versionRange = "[20.5-beta,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.caxton]]
modId = "minecraft"
type = "required"
versionRange = "[1.20.5,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.caxton]]
modId = "oculus"
type = "discouraged"
ordering = "NONE"
side = "CLIENT"
reason = "Caxton uses core shaders for MSDF rendering"

[[dependencies.caxton]]
modId = "emojiful"
type = "incompatible"
ordering = "NONE"
side = "CLIENT"
reason = "Emojiful replaces the text renderer, ignoring Caxton’s changes"

